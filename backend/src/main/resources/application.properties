spring.application.name=ai-watchdog-backend

server.port=8080
server.address=127.0.0.1

ai-watchdog.ml.base-url=http://127.0.0.1:8000
ai-watchdog.ml.connect-timeout-ms=3000
ai-watchdog.ml.read-timeout-ms=10000
# Optional hostname-only URL reputation. The provider implements the JSON contract in doc/URL_REPUTATION_PROVIDER.md.
ai-watchdog.url-reputation.enabled=${AI_WATCHDOG_URL_REPUTATION_ENABLED:false}
ai-watchdog.url-reputation.endpoint=${AI_WATCHDOG_URL_REPUTATION_ENDPOINT:}
ai-watchdog.url-reputation.api-key=${AI_WATCHDOG_URL_REPUTATION_API_KEY:}
ai-watchdog.url-reputation.provider=${AI_WATCHDOG_URL_REPUTATION_PROVIDER:configured-url-provider}
ai-watchdog.url-reputation.timeout-ms=3000
ai-watchdog.url-reputation.requests-per-minute=30
# Optional operator-managed exact-host rules; comma, semicolon, or newline separated.
ai-watchdog.url-rules.denylist=${AI_WATCHDOG_URL_DENYLIST:}
ai-watchdog.url-rules.allowlist=${AI_WATCHDOG_URL_ALLOWLIST:}
ai-watchdog.security.token-file=${AI_WATCHDOG_TOKEN_FILE:}
ai-watchdog.security.enabled=true

# URL and monitor audit data share this SQLite database.
ai-watchdog.security.db-path=aiwatchdog.db

# File Shield reads only within approved roots. Use forward slashes in Windows paths.
ai-watchdog.file-shield.enabled=true
# Approved scan roots are intentionally empty on a clean install. Configure them in Settings.
ai-watchdog.file-shield.max-file-size=104857600
ai-watchdog.file-shield.max-files-per-directory-scan=500
ai-watchdog.file-shield.max-directory-depth=5
ai-watchdog.file-shield.reputation-database-path=file_reputation.db
# Optional hash-only threat intelligence. Disabled unless explicitly enabled with a HTTPS provider URL.
ai-watchdog.file-shield.threat-intel-enabled=${AI_WATCHDOG_THREAT_INTEL_ENABLED:false}
ai-watchdog.file-shield.threat-intel-endpoint=${AI_WATCHDOG_THREAT_INTEL_ENDPOINT:}
ai-watchdog.file-shield.threat-intel-api-key=${AI_WATCHDOG_THREAT_INTEL_API_KEY:}
ai-watchdog.file-shield.threat-intel-timeout-ms=3000
ai-watchdog.file-shield.threat-intel-cache-ttl-seconds=300
ai-watchdog.file-shield.threat-intel-requests-per-minute=30

# Optional backend watcher. The Settings page can change these while Spring is running.
ai-watchdog.file-shield.monitoring-enabled=false
ai-watchdog.file-shield.recursive-monitoring=true
ai-watchdog.file-shield.max-monitoring-depth=5
ai-watchdog.file-shield.monitoring-worker-count=2
ai-watchdog.file-shield.monitoring-queue-capacity=128
ai-watchdog.file-shield.stability-check-interval-ms=250
ai-watchdog.file-shield.stability-check-attempts=6

# Optional Windows Defender and Security event subscriptions. Enable in Settings after reviewing access.
ai-watchdog.windows-telemetry.enabled=false
ai-watchdog.windows-telemetry.script-monitoring-enabled=false
ai-watchdog.windows-telemetry.process-monitoring-enabled=false
ai-watchdog.windows-telemetry.queue-capacity=256
ai-watchdog.windows-telemetry.restart-delay-ms=5000
